# Build portable Windows ZIP (release only — not part of PR test CI).
name: Release Windows portable ZIP

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version string for the ZIP (e.g. 0.1.0)"
        required: true
        default: "0.0.0-dev"

permissions:
  contents: write

jobs:
  build-portable-zip:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify packaging files are present
        shell: bash
        run: |
          test -f backend/pyinstaller.spec
          test -f backend/run_server.py
          test -f backend/requirements-packaging.txt
          test -f scripts/windows/assemble-portable.ps1
          test -f scripts/windows/Launch.bat

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Verify frontend build
        shell: bash
        run: test -f frontend/dist/index.html

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install packaging dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-packaging.txt

      - name: PyInstaller bundle
        working-directory: backend
        run: python -m PyInstaller pyinstaller.spec

      - name: Verify PyInstaller output
        shell: bash
        run: |
          test -f backend/dist/lcm-server/lcm-server.exe
          test -f backend/dist/lcm-server/_internal/alembic/env.py

      - name: Assemble portable ZIP
        shell: pwsh
        run: |
          ./scripts/windows/assemble-portable.ps1 -Version ${{ steps.version.outputs.value }}

      - name: Verify portable ZIP contents
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist/windows-portable/*.zip | Select-Object -First 1
          if (-not $zip) { throw "ZIP not found" }
          $staging = Join-Path $env:RUNNER_TEMP "zip-check"
          if (Test-Path $staging) { Remove-Item -Recurse -Force $staging }
          Expand-Archive -Path $zip.FullName -DestinationPath $staging
          $root = Get-ChildItem $staging | Select-Object -First 1
          $required = @(
            "Launch LEGO Collection Manager.bat",
            "README.txt",
            "config.env.example",
            "lcm-server\lcm-server.exe",
            "lcm-server\_internal\alembic\env.py",
            "web\index.html"
          )
          foreach ($rel in $required) {
            $path = Join-Path $root.FullName $rel
            if (-not (Test-Path $path)) {
              throw "Missing required file in ZIP: $rel"
            }
          }
          Write-Host "ZIP layout OK: $($zip.Name)"

      - name: Upload portable ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: lego-collection-manager-windows-portable
          path: dist/windows-portable/*.zip
          if-no-files-found: error

      - name: Attach ZIP to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/windows-portable/*.zip
          generate_release_notes: true
